<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Mods Vault</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { text-align: center; color: #4CAF50; margin-bottom: 25px; }
        
        /* ช่องค้นหา */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus { border-color: #4CAF50; }

        /* ตัวกรองหมวดหมู่ */
        .categories { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .cat-btn {
            background: #252525;
            color: #ccc;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover { background: #4CAF50; color: white; border-color: #4CAF50; }

        /* รายการมอด */
        .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .mod-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .badge {
            align-self: flex-start;
            background: #333;
            color: #4CAF50;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .mod-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .mod-desc { font-size: 14px; color: #aaa; margin-bottom: 15px; flex-grow: 1; }
        .mod-meta { font-size: 13px; color: #777; margin-bottom: 15px; }
        
        .btn-download {
            background: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-download:hover { background: #45a049; }
        .no-results { text-align: center; color: #888; width: 100%; padding: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Minecraft Mods Collection</h1>
    
    <!-- ช่องค้นหา -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 พิมพ์ชื่อมอดที่ต้องการค้นหา...">
    
    <!-- ปุ่มหมวดหมู่ -->
    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('All')">ทั้งหมด</button>
        <button class="cat-btn" onclick="filterCategory('Resource Pack')">Resource Pack</button>
        <button class="cat-btn" onclick="filterCategory('Addon')">Addon / Mod</button>
        <button class="cat-btn" onclick="filterCategory('Map')">Map</button>
    </div>

    <!-- แสดงรายการมอด -->
    <div id="modList" class="mod-grid"></div>
</div>

<script>
    let allMods = [];
    let currentCategory = 'All';

    // โหลดข้อมูลมอดจาก Server
    async function fetchMods() {
        try {
            const res = await fetch('/api/mods');
            allMods = await res.json();
            renderMods();
        } catch (err) {
            console.error('Error fetching mods:', err);
        }
    }

    // ฟังก์ชันคำนวณคะแนนความคล้ายของคำ (Closest Match Algorithm)
    function getSearchScore(mod, query) {
        if (!query) return 1;
        query = query.toLowerCase().trim();
        const title = mod.name.toLowerCase();
        const desc = mod.description.toLowerCase();
        const cat = mod.category.toLowerCase();

        if (title === query) return 100; // ตรงเป๊ะ
        if (title.startsWith(query)) return 80; // ขึ้นต้นด้วยคำที่ค้น
        if (title.includes(query)) return 50; // มีคำที่ค้นอยู่ข้างใน
        if (desc.includes(query) || cat.includes(query)) return 20; // เจอในคำอธิบาย/หมวดหมู่
        
        return 0; // ไม่ตรงเลย
    }

    // ฟังก์ชันกรองและจัดเรียงมอด
    function renderMods() {
        const query = document.getElementById('searchInput').value;
        const container = document.getElementById('modList');

        // Filter ตามหมวดหมู่ + คำนวณคะแนนค้นหา
        let filtered = allMods
            .filter(mod => currentCategory === 'All' || mod.category === currentCategory)
            .map(mod => ({ mod, score: getSearchScore(mod, query) }))
            .filter(item => item.score > 0)
            .sort((a, b) => b.score - a.score); // เรียงอันดับจากคะแนนสูงสุดขึ้นก่อน (Closest Match)

        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-results">❌ ไม่พบมอดที่ตรงกับการค้นหา</div>';
            return;
        }

        container.innerHTML = filtered.map(({ mod }) => `
            <div class="mod-card">
                <span class="badge">${mod.category}</span>
                <div class="mod-title">${mod.name}</div>
                <div class="mod-desc">${mod.description}</div>
                <div class="mod-meta">
                    💾 ขนาด: ${mod.fileSize} | 📥 ดาวน์โหลด: <span id="count-${mod.id}">${mod.downloads}</span> ครั้ง
                </div>
                <button class="btn-download" onclick="downloadMod('${mod.id}', '${mod.downloadUrl}')">
                    ⬇️ ดาวน์โหลด
                </button>
            </div>
        `).join('');
    }

    // เปลี่ยนหมวดหมู่
    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(category) || (category === 'All' && btn.innerText === 'ทั้งหมด'));
        });
        renderMods();
    }

    // ระบบนับการโหลด
    async function downloadMod(id, url) {
        try {
            const res = await fetch(`/api/download/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                document.getElementById(`count-${id}`).innerText = data.downloads;
                window.open(url, '_blank');
            }
        } catch (err) {
            console.error('Download error:', err);
        }
    }

    // ดักจับการพิมพ์ในช่องค้นหา
    document.getElementById('searchInput').addEventListener('input', renderMods);

    // เริ่มต้นทำงาน
    fetchMods();
</script>

</body>
</html>
