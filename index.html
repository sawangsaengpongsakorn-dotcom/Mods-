<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Mod & Addon Downloads</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 50px; }
        
        header { background: #1b2838; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #55ff55; }
        header h1 { font-size: 24px; color: #55ff55; text-shadow: 2px 2px #000; }
        
        .btn { background: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #218838; }
        .btn-download { background: #007bff; display: block; text-align: center; text-decoration: none; margin-top: 15px; }
        .btn-download:hover { background: #0056b3; }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .mod-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 15px; transition: transform 0.2s; }
        .mod-card:hover { transform: translateY(-5px); border-color: #55ff55; }
        .mod-card img { width: 100%; height: 180px; object-fit: cover; }
        .mod-info { padding: 15px; }
        .mod-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .mod-artist { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        .mod-date { font-size: 12px; color: #666; }

        /* Modal อัปโหลด */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; position: relative; border: 1px solid #444; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 MC Mod Hub</h1>
        <button class="btn" onclick="openModal()">+ อัปโหลดมอด (เฉพาะ Admin)</button>
    </header>

    <div class="container">
        <h2>รายการมอดทั้งหมด</h2>
        <br>
        <div class="mod-grid" id="modGrid">
            <!-- ข้อมูลมอดจะถูกแสดงที่นี่ -->
        </div>
    </div>

    <!-- Modal ฟอร์มอัปโหลด -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin-bottom: 20px;">อัปโหลดมอดใหม่</h3>
            <form id="uploadForm">
                <div class="form-group">
                    <label>รหัสผ่าน Admin</label>
                    <input type="password" id="adminPassword" required placeholder="ใส่รหัสผ่านเพื่ออัปโหลด">
                </div>
                <div class="form-group">
                    <label>ชื่อมอด / Addon</label>
                    <input type="text" id="modTitle" required placeholder="เช่น Furniture Addon v1.0">
                </div>
                <div class="form-group">
                    <label>ชื่อผู้สร้าง (Artist/Creator)</label>
                    <input type="text" id="modArtist" required placeholder="เช่น SteveCraft">
                </div>
                <div class="form-group">
                    <label>รูปภาพหรือโลโก้ตัวอย่าง (.png, .jpg)</label>
                    <input type="file" id="coverImage" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>ไฟล์มอด (.zip, .mcaddon, .mcpack, .jar)</label>
                    <input type="file" id="modFile" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">ตกลงและอัปโหลด</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('uploadModal');
        const uploadForm = document.getElementById('uploadForm');

        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }

        // ดึงรายการมอดมาแสดง
        async function fetchMods() {
            const res = await fetch('/api/mods');
            const mods = await res.json();
            const modGrid = document.getElementById('modGrid');
            
            if (mods.length === 0) {
                modGrid.innerHTML = '<p style="color: #888;">ยังไม่มีมอดในระบบ</p>';
                return;
            }

            modGrid.innerHTML = mods.map(mod => `
                <div class="mod-card">
                    <div>
                        <img src="${mod.coverImageUrl}" alt="${mod.title}">
                        <div class="mod-info">
                            <div class="mod-title">${mod.title}</div>
                            <div class="mod-artist">สร้างโดย: <b>${mod.artist}</b></div>
                            <div class="mod-date">อัปโหลดเมื่อ: ${mod.date}</div>
                        </div>
                    </div>
                    <div style="padding: 0 15px;">
                        <a href="${mod.modFileUrl}" download class="btn btn-download">📥 ดาวน์โหลดมอด</a>
                    </div>
                </div>
            `).join('');
        }

        // จัดการการส่งฟอร์มอัปโหลด
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('password', document.getElementById('adminPassword').value);
            formData.append('title', document.getElementById('modTitle').value);
            formData.append('artist', document.getElementById('modArtist').value);
            formData.append('coverImage', document.getElementById('coverImage').files[0]);
            formData.append('modFile', document.getElementById('modFile').files[0]);

            const res = await fetch('/api/mods', {
                method: 'POST',
                body: formData
            });

            const result = await res.json();

            if (result.success) {
                alert(result.message);
                uploadForm.reset();
                closeModal();
                fetchMods();
            } else {
                alert(result.message);
            }
        });

        // โหลดมอดเมื่อเปิดหน้าเว็บ
        fetchMods();
    </script>
</body>
</html>
