<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Mod Community</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1e293b; border-radius: 12px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    h1 { font-size: 1.5rem; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .btn { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #059669; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    
    .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn { background: #334155; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .filter-btn.active { background: #38bdf8; color: #0f172a; font-weight: 600; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #0f172a; }
    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; color: #f1f5f9; }
    .card-author { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    .card-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: #64748b; margin-bottom: 15px; }
    .card-actions { display: flex; gap: 8px; }
    .card-actions a, .card-actions button { flex: 1; text-align: center; text-decoration: none; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #1e293b; width: 100%; max-width: 500px; border-radius: 12px; padding: 25px; border: 1px solid #475569; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cbd5e1; }
    .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
    .form-control:focus { border-color: #38bdf8; }

    .progress-container { margin-top: 15px; display: none; }
    .progress-bar-bg { width: 100%; background: #0f172a; height: 12px; border-radius: 6px; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.2s; }
    .progress-text { font-size: 0.85rem; color: #38bdf8; text-align: center; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Minecraft Mod Hub</h1>
    <button class="btn" onclick="openModal()">+ อัปโหลดมอด (Admin)</button>
  </header>

  <div class="filters">
    <button class="filter-btn active" onclick="filterMods('ทั้งหมด', this)">ทั้งหมด</button>
    <button class="filter-btn" onclick="filterMods('Mod', this)">Mod</button>
    <button class="filter-btn" onclick="filterMods('Addon', this)">Addon</button>
    <button class="filter-btn" onclick="filterMods('Texture Pack', this)">Texture Pack</button>
    <button class="filter-btn" onclick="filterMods('Map', this)">Map</button>
  </div>

  <div id="modGrid" class="grid"></div>

  <!-- Modal Dialog -->
  <div id="uploadModal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <h2 style="margin-bottom: 15px; color: #38bdf8;">อัปโหลดมอดใหม่</h2>
      <form id="uploadForm" onsubmit="handleUpload(event)">
        <div class="form-group">
          <label>รหัสผ่าน Admin</label>
          <input type="password" id="adminPass" class="form-control" placeholder="ใส่รหัส admin..." required>
        </div>
        <div class="form-group">
          <label>ชื่อมอด</label>
          <input type="text" id="modTitle" class="form-control" placeholder="เช่น Lucky Block Mod" required>
        </div>
        <div class="form-group">
          <label>ชื่อผู้สร้าง / Artist</label>
          <input type="text" id="modArtist" class="form-control" placeholder="เช่น Alex" required>
        </div>
        <div class="form-group">
          <label>หมวดหมู่</label>
          <select id="modCategory" class="form-control" required>
            <option value="Mod">Mod</option>
            <option value="Addon">Addon</option>
            <option value="Texture Pack">Texture Pack</option>
            <option value="Map">Map</option>
          </select>
        </div>
        <div class="form-group">
          <label>รูปภาพปก (Image)</label>
          <input type="file" id="coverFile" class="form-control" accept="image/*" required>
        </div>
        <div class="form-group">
          <label>ไฟล์มอด (.zip, .mcaddon, .mcpack, .jar)</label>
          <input type="file" id="modFile" class="form-control" required>
        </div>

        <div id="progressBox" class="progress-container">
          <div class="progress-bar-bg">
            <div id="progressFill" class="progress-bar-fill"></div>
          </div>
          <div id="progressText" class="progress-text">0%</div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex:1;">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="btn" style="flex:1;">ตกลงและอัปโหลด</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kiaqwvaogvdoxwqwqawk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zjc_X6hCvFmUQ30WBttZXw_Du7BgolU";
    const ADMIN_PASSWORD = "admin1234password";

    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let allMods = [];
    let currentFilter = 'ทั้งหมด';

    function openModal() {
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('uploadModal').style.display = 'none';
      document.getElementById('uploadForm').reset();
      document.getElementById('progressBox').style.display = 'none';
    }

    async function loadMods() {
      const grid = document.getElementById('modGrid');
      grid.innerHTML = '<p style="color: #94a3b8;">กำลังโหลดข้อมูล...</p>';

      if (!supabase) {
        grid.innerHTML = '<p style="color: #ef4444;">ไม่สามารถเชื่อมต่อ Supabase ได้</p>';
        return;
      }

      const { data, error } = await supabase.from('mods').select('*').order('id', { ascending: false });

      if (error) {
        console.error(error);
        grid.innerHTML = '<p style="color: #ef4444;">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
        return;
      }

      allMods = data || [];
      renderMods();
    }

    function filterMods(category, btn) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      renderMods();
    }

    function renderMods() {
      const grid = document.getElementById('modGrid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'ทั้งหมด' 
        ? allMods 
        : allMods.filter(m => m.category === currentFilter);

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1;">ยังไม่มีมอดในหมวดหมู่นี้</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.cover_url || 'https://via.placeholder.com/300x160?text=No+Image'}" class="card-img" alt="Cover">
          <div class="card-body">
            <div>
              <div class="card-title">${escapeHtml(item.title)}</div>
              <div class="card-author">โดย: ${escapeHtml(item.artist)} | <span style="color:#38bdf8">${escapeHtml(item.category)}</span></div>
            </div>
            <div>
              <div class="card-meta">
                <span>📅 ${item.date || '-'}</span>
                <span>📥 ${item.downloads || 0} ครั้ง</span>
              </div>
              <div class="card-actions">
                <a href="${item.file_url}" target="_blank" download class="btn" style="padding: 8px;" onclick="incrementDownload(${item.id}, ${item.downloads || 0})">ดาวน์โหลด</a>
                <button class="btn btn-danger" style="padding: 8px; max-width: 70px;" onclick="deleteMod(${item.id})">ลบ</button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function handleUpload(e) {
      e.preventDefault();
      
      const pass = document.getElementById('adminPass').value;
      if (pass !== ADMIN_PASSWORD) {
        alert('รหัสผ่าน Admin ไม่ถูกต้อง!');
        return;
      }

      const title = document.getElementById('modTitle').value;
      const artist = document.getElementById('modArtist').value;
      const category = document.getElementById('modCategory').value;
      const coverFile = document.getElementById('coverFile').files[0];
      const modFile = document.getElementById('modFile').files[0];

      if (!coverFile || !modFile) {
        alert('กรุณาเลือกไฟล์ให้ครบถ้วน');
        return;
      }

      const progressBox = document.getElementById('progressBox');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const submitBtn = document.getElementById('submitBtn');

      progressBox.style.display = 'block';
      submitBtn.disabled = true;

      try {
        progressText.innerText = 'กำลังอัปโหลดรูปภาพปก...';
        progressFill.style.width = '20%';
        const coverExt = coverFile.name.split('.').pop();
        const coverName = `cover_${Date.now()}.${coverExt}`;
        const { error: coverErr } = await supabase.storage.from('mods').upload(coverName, coverFile);
        if (coverErr) throw coverErr;

        const { data: coverUrlData } = supabase.storage.from('mods').getPublicUrl(coverName);
        const coverUrl = coverUrlData.publicUrl;

        progressText.innerText = 'กำลังอัปโหลดไฟล์มอด...';
        progressFill.style.width = '60%';
        const modExt = modFile.name.split('.').pop();
        const modFileName = `file_${Date.now()}.${modExt}`;
        const { error: modErr } = await supabase.storage.from('mods').upload(modFileName, modFile);
        if (modErr) throw modErr;

        const { data: modUrlData } = supabase.storage.from('mods').getPublicUrl(modFileName);
        const fileUrl = modUrlData.publicUrl;

        progressText.innerText = 'กำลังบันทึกข้อมูล...';
        progressFill.style.width = '85%';

        const today = new Date().toLocaleDateString('th-TH');
        const { error: dbErr } = await supabase.from('mods').insert([{
          title: title,
          artist: artist,
          category: category,
          cover_url: coverUrl,
          file_url: fileUrl,
          file_name: modFile.name,
          date: today,
          downloads: 0
        }]);

        if (dbErr) throw dbErr;

        progressFill.style.width = '100%';
        progressText.innerText = 'อัปโหลดเสร็จสมบูรณ์!';
        
        setTimeout(() => {
          closeModal();
          submitBtn.disabled = false;
          loadMods();
        }, 800);

      } catch (err) {
        console.error(err);
        alert('เกิดข้อผิดพลาดในการอัปโหลด: ' + err.message);
        submitBtn.disabled = false;
        progressBox.style.display = 'none';
      }
    }

    async function incrementDownload(id, currentDl) {
      await supabase.from('mods').update({ downloads: currentDl + 1 }).eq('id', id);
      setTimeout(loadMods, 1000);
    }

    async function deleteMod(id) {
      const pass = prompt('กรุณาใส่รหัสผ่าน Admin เพื่อยืนยันการลบ:');
      if (pass !== ADMIN_PASSWORD) {
        if(pass !== null) alert('รหัสผ่านไม่ถูกต้อง');
        return;
      }

      const { error } = await supabase.from('mods').delete().eq('id', id);
      if (error) {
        alert('เกิดข้อผิดพลาดในการลบ: ' + error.message);
      } else {
        alert('ลบมอดเรียบร้อยแล้ว');
        loadMods();
      }
    }

    window.addEventListener('DOMContentLoaded', loadMods);
  </script>
</body>
</html>
